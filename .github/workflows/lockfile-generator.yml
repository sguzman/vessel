name: Lockfile Generator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit migrated lockfile
        shell: bash
        run: |
          cargo generate-lockfile
          rm .github/workflows/lockfile-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/lockfile-generator.yml
          git commit -m "chore: refresh migrated Cargo.lock"
          git push
