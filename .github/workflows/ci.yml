name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Format active corpus files
        if: always()
        run: |
          cargo fmt -p vessel-core -p vessel-extractors -p vessel-asr
          git diff --exit-code -- \
            crates/vessel-core/src/error.rs \
            crates/vessel-core/src/lib.rs \
            crates/vessel-core/src/sourcearium.rs \
            crates/vessel-core/src/sourcearium_repo.rs \
            crates/vessel-core/src/transcript.rs \
            crates/vessel-extractors/src/youtube/transcript.rs \
            crates/vessel-asr/src/lib.rs

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test path and corpus layers
        run: cargo test -p vessel-core -p vessel-store -p vessel-asr --all-targets

      - name: Compile native Windows CLI
        run: cargo check -p vessel-cli
