name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Guard retired machinery
        shell: bash
        run: |
          test ! -d crates/vessel-diarization
          test ! -d crates/vessel-download
          test ! -d crates/vessel-formats
          test ! -d crates/vessel-postprocess
          if grep -R -E 'SherpaOnnx|whisper_candle|whisper-candle-core|BasicDownloadPlanner' crates/vessel-cli crates/vessel-asr crates/vessel-extractors Cargo.toml; then
            echo "retired implementation machinery reappeared"
            exit 1
          fi

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets

      - name: Verify reduced CLI and offline doctor
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          cargo run --locked --offline -q -p vessel-cli -- --help > /tmp/vessel-help.txt
          grep -q 'update' /tmp/vessel-help.txt
          grep -q 'validate' /tmp/vessel-help.txt
          grep -q 'inventory' /tmp/vessel-help.txt
          grep -q 'prune' /tmp/vessel-help.txt
          cargo run --locked --offline -q -p vessel-cli -- doctor > /tmp/vessel-doctor.json
          grep -q '"architecture": "external-toolchain"' /tmp/vessel-doctor.json

      - name: Check formatting
        run: cargo fmt --all -- --check

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test durable layers
        run: cargo test --locked -p vessel-core -p vessel-store -p vessel-asr -p vessel-extractors --all-targets

      - name: Compile Windows CLI
        run: cargo check --locked -p vessel-cli
