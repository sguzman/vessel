[workspace]
members = [
    "crates/vessel-cli",
    "crates/vessel-core",
    "crates/vessel-extractors",
    "crates/vessel-ledger",
    "crates/vessel-store",
    "crates/vessel-logging",
    "crates/vessel-formats",
    "crates/vessel-download",
    "crates/vessel-postprocess",
    "crates/vessel-testing",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "time", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
